packages:
  - 'nestjs-api'
  - 'nextjs-frontend'
  - 'reactnative-mobile'

allowBuilds:
  '@scarf/scarf': true
  esbuild: true
  msgpackr-extract: true
  puppeteer: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@expo/image-utils@0.11.6'
  - '@expo/require-utils@57.0.6'
  - expo-constants@57.0.21
  - expo-notifications@57.0.22

onlyBuiltDependencies:
  - '@scarf/scarf'
  - 'esbuild'
  - 'msgpackr-extract'
  - 'puppeteer'
  - 'unrs-resolver'

services:
    postgres:
        ports: !override
            - "25432:5432"
        environment:
            POSTGRES_DB: martial_arts_tracker_e2e
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "psql -U postgres -d martial_arts_tracker_e2e -tAc \"SELECT count(*) FROM mma_private.migration_history WHERE version = 21\" 2>/dev/null | grep -qx 1",
                ]
    redis:
        ports: !override
            - "16379:6379"
    nestjs-api:
        ports: !override
            - "13001:3001"
        environment:
            NODE_ENV: test
            AUTH_PROVIDER: local
            DATABASE_URL: postgresql://postgres:postgres@postgres:5432/martial_arts_tracker_e2e
            FRONTEND_URL: http://localhost:13000
        depends_on:
            e2e-seed:
                condition: service_healthy
    nextjs-frontend:
        ports: !override
            - "13000:3000"
        environment:
            API_URL: http://nestjs-api:3001
            NEXT_PUBLIC_API_URL: http://localhost:13001
    e2e-seed:
        image: mma-tms-nestjs-api:latest
        build:
            context: ./nestjs-api
            dockerfile: Dockerfile
        command:
            [
                "sh",
                "-c",
                "node /app/seed-local-e2e.mjs && touch /tmp/seed-ready && exec tail -f /dev/null",
            ]
        environment:
            DATABASE_URL: postgresql://postgres:postgres@postgres:5432/martial_arts_tracker_e2e
            E2E_PASSWORD: ${E2E_PASSWORD:?Set E2E_PASSWORD}
        volumes:
            - ./nestjs-api/scripts/seed-local-e2e.mjs:/app/seed-local-e2e.mjs:ro
        depends_on:
            postgres:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "test", "-f", "/tmp/seed-ready"]
            interval: 2s
            timeout: 2s
            retries: 15
